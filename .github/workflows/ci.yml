name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hygiene, lint, types, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      - run: python scripts/check_repo.py
      - run: uv lock --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests scripts
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color .github/workflows/ci.yml .github/workflows/install.yml .github/workflows/docker.yml .github/workflows/installers.yml

  tests:
    name: Tests, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # ffmpeg as users get it: the distribution's on Linux (the action's static 7.0.2 build crashes on
      # AAC in MPEG-TS), Homebrew's on macOS (Apple silicon runners: the action is x64 only), the
      # action's build on Windows.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6  # v3.1
      - run: uv run --frozen --group dev pytest -m "not page" --cov --cov-report=term-missing:skip-covered -q

  page:
    name: Practice page in Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WOODSHED_REQUIRE_PAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      # ffmpeg, and a sound server with a null output: without an audio device Firefox refuses to
      # play the tracks ("OnMediaSinkAudioError").
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silence
          pactl set-default-sink silence
      - run: uv run --frozen --group dev playwright install --with-deps chromium firefox
      - run: uv run --frozen --group dev pytest -q -m page --browser chromium --browser firefox

  package:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
      - run: uv build
      - run: uv run --frozen --group dev twine check --strict dist/*
      - run: python scripts/check_wheel.py dist/*.whl
      - run: |
          uv venv smoke
          VIRTUAL_ENV=smoke uv pip install dist/*.whl
          smoke/bin/woodshed --version

  stems:
    name: Stems extra (real Demucs and beat_this), Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      WOODSHED_CACHE: ${{ github.workspace }}/.woodshed-cache
      WOODSHED_REQUIRE_STEMS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      # Saved only after the real tests pass, so only with both models complete. Bump the key
      # when a model changes.
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .woodshed-cache/models
          key: woodshed-models-v1
      # CPU-only torch comes from the PyTorch index set in pyproject.toml (no 5 GB CUDA download).
      - run: uv run --frozen --extra stems --group dev pytest -q -m stems
      - if: success() && matrix.python == '3.13' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .woodshed-cache/models
          key: woodshed-models-v1
