name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hygiene, lint, types, workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      - run: python scripts/check_repo.py
      - run: uv lock --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests scripts
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color .github/workflows/ci.yml .github/workflows/install.yml .github/workflows/docker.yml .github/workflows/installers.yml

  tests:
    name: Tests, ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25  # Windows on Python 3.10 is the slowest: 18 minutes with the key change songs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # ffmpeg as users get it: the distribution's on Linux (the action's static 7.0.2 build crashes on
      # AAC in MPEG-TS), Homebrew's on macOS (Apple silicon runners: the action is x64 only), the
      # action's build on Windows.
      # A slow mirror would hang the whole job: scripts/ci-apt.sh cuts each try short.
      # The Rubber Band program (spec 017): Ubuntu 24.04's rubberband-cli (3.3) on Linux; on macOS and Windows
      # the pinned 4.0.0, fetched and checked by the installers' own function, as users get it.
      - if: runner.os == 'Linux'
        run: bash scripts/ci-apt.sh ffmpeg rubberband-cli
      - if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6  # v3.1
      - if: runner.os == 'macOS'
        run: |
          sed -n '/^get_rubberband() {/,/^}/p' scripts/install.sh > "$RUNNER_TEMP/get_rubberband.sh"
          WOODSHED_TOOLS="$RUNNER_TEMP/tools" sh -c '. "$1" && get_rubberband' sh "$RUNNER_TEMP/get_rubberband.sh"
          test -x "$RUNNER_TEMP/tools/rubberband"
          echo "WOODSHED_TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP "tools"
          . ./scripts/install.ps1
          if (-not (Get-Rubberband -Tools $tools)) { throw "Rubber Band was not fetched" }
          "WOODSHED_TOOLS=$tools" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: uv run --frozen --group dev pytest -m "not page" --cov --cov-report=term-missing:skip-covered -q
        env:
          # The singer's key needs ffmpeg's Rubber Band filter: Ubuntu's ffmpeg has it, Homebrew's plain one
          # does not (macOS and Windows skip those tests). The Rubber Band program is everywhere.
          WOODSHED_REQUIRE_PITCH: ${{ runner.os == 'Linux' && '1' || '' }}
          WOODSHED_REQUIRE_RUBBERBAND: "1"

  page:
    name: Practice page in Chromium and Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WOODSHED_REQUIRE_PAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      # ffmpeg, and a sound server with a null output: without an audio device Firefox refuses to
      # play the tracks ("OnMediaSinkAudioError").
      - run: |
          bash scripts/ci-apt.sh ffmpeg pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silence
          pactl set-default-sink silence
      - run: uv run --frozen --group dev playwright install --with-deps chromium firefox
      # Spread over the runner's cores, as scripts/ci.sh does: one by one the page tests reached the 20-minute limit.
      - run: uv run --frozen --group dev pytest -q -m page -n 4 --browser chromium --browser firefox

  tablet:
    name: Practice page in WebKit (tablets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WOODSHED_REQUIRE_PAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      # The same sound server as the page job: a browser without an audio device may refuse to play.
      - run: |
          bash scripts/ci-apt.sh ffmpeg pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silence
          pactl set-default-sink silence
      - run: uv run --frozen --group dev playwright install --with-deps webkit
      # WebKit is Safari's engine, not iPadOS Safari: what an iPad needs of the page (spec 011), a real iPad
      # stays the last check.
      - run: uv run --frozen --group dev pytest -q -m tablet -n 4 --browser webkit

  package:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"
      - run: uv build
      - run: uv run --frozen --group dev twine check --strict dist/*
      - run: python scripts/check_wheel.py dist/*.whl
      - run: |
          uv venv smoke
          VIRTUAL_ENV=smoke uv pip install dist/*.whl
          smoke/bin/woodshed --version

  stems:
    name: Stems extra (real Demucs and beat_this), Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      WOODSHED_CACHE: ${{ github.workspace }}/.woodshed-cache
      WOODSHED_REQUIRE_STEMS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/ci-apt.sh ffmpeg
      # Saved only after the real tests pass, so only with every model complete. Bump the key
      # when a model changes: the older cache is restored first, so only the new model downloads.
      - id: models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .woodshed-cache/models
          key: woodshed-models-v2
          restore-keys: woodshed-models-
      # CPU-only torch comes from the PyTorch index set in pyproject.toml (no 5 GB CUDA download).
      - run: uv run --frozen --extra stems --group dev pytest -q -m stems
      - if: success() && matrix.python == '3.13' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .woodshed-cache/models
          key: woodshed-models-v2
