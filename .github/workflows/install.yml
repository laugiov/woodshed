name: Install

# The ways a musician installs woodshed, tried on real machines: the install scripts on Linux,
# macOS and Windows (from this checkout), then a page built from the demo song; the double-click
# installers on macOS and Windows; the Uninstall woodshed shortcuts they leave; and the Docker
# image on x86 and ARM.

on:
  push:
    branches: [main]
    paths: ["scripts/install.*", "scripts/installers/**", "src/woodshed/uninstall.py", "src/woodshed/cli.py", "Dockerfile", "compose.yaml", ".dockerignore", "pyproject.toml", "uv.lock", ".github/workflows/install.yml"]
  pull_request:
    paths: ["scripts/install.*", "scripts/installers/**", "src/woodshed/uninstall.py", "src/woodshed/cli.py", "Dockerfile", "compose.yaml", ".dockerignore", "pyproject.toml", "uv.lock", ".github/workflows/install.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: Install script, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ffmpeg, as the script tells users to add it
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg; else bash scripts/ci-apt.sh ffmpeg; fi
      - name: Install woodshed with the script (on macOS from an archive, as users get it)
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            git archive --format=tar.gz --prefix=woodshed/ -o "$RUNNER_TEMP/w.tar.gz" HEAD
            echo "WOODSHED_SOURCE=file://$RUNNER_TEMP/w.tar.gz" >> "$GITHUB_ENV"
            WOODSHED_SOURCE="file://$RUNNER_TEMP/w.tar.gz" sh scripts/install.sh
          else
            WOODSHED_SOURCE="$PWD" sh scripts/install.sh
          fi
      - name: A page from the demo song (the mix only, the models are not downloaded here)
        run: |
          "$(uv tool dir --bin)/woodshed" "demo/As I Am.mp3" --no-stems --no-open -o out
          test -f "out/As I Am.woodshed/index.html"
      - name: The Rubber Band program the script fetched, the pinned one, and it runs
        if: runner.os == 'macOS'
        run: |
          tools="$HOME/Library/Application Support/woodshed/tools"
          grep -qF "$(shasum -a 256 "$tools/rubberband" | cut -d' ' -f1)" scripts/install.sh
          test -f "$tools/COPYING"
          "$tools/rubberband" -V 2>&1 | grep -F 4.0.0
      # The installers download install.sh / install.ps1 from GitHub at this commit, as they do at a
      # tag; what those install is this checkout's archive (WOODSHED_SOURCE, set above).
      - name: The double-click installer, as Finder runs it, and the app it makes
        if: runner.os == 'macOS'
        env:
          WOODSHED_NO_OPEN: "1"
          WOODSHED_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test -x "scripts/installers/Install woodshed.command"
          rm -rf ~/Applications/woodshed.app
          bash "scripts/installers/Install woodshed.command"
          app=~/Applications/woodshed.app/Contents
          plutil -lint "$app/Info.plist"
          test -x "$app/MacOS/woodshed"
          test -x "$app/Resources/woodshed.command"
          sh -n "$app/Resources/woodshed.command"
          grep -qF "$(uv tool dir --bin)/woodshed' app" "$app/Resources/woodshed.command"
      - name: The app starts woodshed in a Terminal window, and the library answers
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          open ~/Applications/woodshed.app
          for _ in $(seq 1 90); do
            curl -sf -m 3 http://127.0.0.1:8000/ | grep -q woodshed && ok=1 && break
            sleep 1
          done
          pkill -f "$(uv tool dir --bin)/woodshed app" || true
          if [ -z "${ok:-}" ]; then
            echo "::error::woodshed did not answer within 90 s of opening the app (could the runner open Terminal?)"
            pgrep -fil "terminal|woodshed" || true
            exit 1
          fi
      # What the Uninstall woodshed shortcut runs (the Mac app's script, the Linux menu entry's), with
      # --yes for the question: woodshed, its cache tracks and its shortcuts go, a library stays.
      - name: Uninstall woodshed as its shortcut does, the songs kept
        timeout-minutes: 5
        env:
          WOODSHED_NO_PAUSE: "1"
        run: |
          set -eu
          bin="$(uv tool dir --bin)"
          mkdir -p ~/woodshed && echo "a song" > ~/woodshed/kept.txt
          cache="$("$bin/woodshed" cache | sed -n 's/^cache: //p')"
          mkdir -p "$cache/stems/x" "$cache/models" && echo x > "$cache/stems/x/vocals.flac"
          data="${XDG_DATA_HOME:-$HOME/.local/share}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            app=~/Applications/"Uninstall woodshed.app"/Contents
            plutil -lint "$app/Info.plist"
            test -x "$app/MacOS/uninstall"
            script="$app/Resources/uninstall.command"
            tools=~/"Library/Application Support/woodshed/tools"
          else
            entry="$data/applications/woodshed-uninstall.desktop"
            grep -qx 'Terminal=true' "$entry"
            tools="$data/woodshed/tools"
            script="$tools/uninstall-woodshed.sh"
            grep -qxF "Exec=sh \"$script\"" "$entry"
          fi
          sh -n "$script"
          # The app started above may still be closing: woodshed refuses while its port answers.
          for _ in $(seq 1 30); do curl -s -m 2 -o /dev/null http://127.0.0.1:8000/ || break; sleep 1; done
          before="$(du -sk "$(uv cache dir)" | cut -f1)"
          sh "$script" --yes
          gone=""
          for _ in $(seq 1 60); do
            if ! uv tool list 2>/dev/null | grep -q '^woodshed '; then gone=1; break; fi
            sleep 1
          done
          after="$(du -sk "$(uv cache dir)" | cut -f1)"
          echo "uv cache: ${before} KB before, ${after} KB after the uninstall (uv cache prune)"
          test -n "$gone" || { echo "::error::woodshed is still in uv tool list after 60 s"; exit 1; }
          test ! -e "$bin/woodshed"
          test ! -e "$cache/stems" && test ! -e "$cache/models"
          test ! -e "$tools"
          if [ "$RUNNER_OS" = "macOS" ]; then
            test ! -e ~/Applications/woodshed.app && test ! -e ~/Applications/"Uninstall woodshed.app"
          else
            test ! -e "$data/applications/woodshed.desktop" && test ! -e "$data/applications/woodshed-uninstall.desktop"
          fi
          test "$(cat ~/woodshed/kept.txt)" = "a song"

  windows:
    name: Install script, windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6  # v3.1
      - name: Install woodshed with the script, from an archive as users get it
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "w.zip"
          git archive --format=zip --prefix=woodshed/ -o $zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "no archive" }
          $env:WOODSHED_SOURCE = ([System.Uri]$zip).AbsoluteUri
          "WOODSHED_SOURCE=$env:WOODSHED_SOURCE" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          ./scripts/install.ps1
      - name: A page from the demo song, and the Start menu shortcut
        shell: pwsh
        run: |
          $exe = Join-Path (uv tool dir --bin).Trim() "woodshed.exe"
          & $exe "demo/As I Am.mp3" --no-stems --no-open -o out
          if ($LASTEXITCODE -ne 0) { throw "the page was not built" }
          if (-not (Test-Path "out/As I Am.woodshed/index.html")) { throw "no page" }
          $link = Join-Path ([Environment]::GetFolderPath("Programs")) "woodshed.lnk"
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
      - name: The Rubber Band program the script fetched, the pinned one, and it runs
        shell: pwsh
        run: |
          $tools = Join-Path $env:LOCALAPPDATA "woodshed\tools"
          foreach ($file in "rubberband.exe", "sndfile.dll") {
            $hash = (Get-FileHash (Join-Path $tools $file) -Algorithm SHA256).Hash.ToLower()
            if (-not (Select-String -Path scripts/install.ps1 -Pattern $hash -SimpleMatch -Quiet)) { throw "$file is not the pinned one" }
          }
          if (-not (Test-Path (Join-Path $tools "COPYING.txt"))) { throw "no licence next to the program" }
          $version = & (Join-Path $tools "rubberband.exe") -V 2>&1 | Out-String
          if ($version -notmatch "4\.0\.0") { throw "the program does not run: $version" }
      - name: The double-click installer, and the Start menu shortcut it leaves
        shell: pwsh
        env:
          WOODSHED_NO_OPEN: "1"
          WOODSHED_NO_PAUSE: "1"
          WOODSHED_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $link = Join-Path ([Environment]::GetFolderPath("Programs")) "woodshed.lnk"
          Remove-Item $link
          & "./scripts/installers/Install woodshed.cmd"
          if ($LASTEXITCODE -ne 0) { throw "the installer failed" }
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($link).TargetPath
          if (-not (Test-Path $target)) { throw "the shortcut points to nothing: $target" }
      # What Settings > Apps and the Start menu's Uninstall woodshed run, with --yes for the question:
      # woodshed, its cache tracks, its shortcuts and its Settings entry go, a library stays.
      - name: Uninstall woodshed as Settings > Apps does, the songs kept
        shell: pwsh
        timeout-minutes: 5
        env:
          WOODSHED_NO_PAUSE: "1"
        run: |
          $exe = Join-Path (uv tool dir --bin).Trim() "woodshed.exe"
          $lib = Join-Path $env:USERPROFILE "woodshed"
          New-Item -ItemType Directory -Force $lib | Out-Null
          Set-Content -Path (Join-Path $lib "kept.txt") -Value "a song"
          $cache = ((& $exe cache) | Select-String "^cache: (.*)$").Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force (Join-Path $cache "stems\x"), (Join-Path $cache "models") | Out-Null
          Set-Content -Path (Join-Path $cache "stems\x\vocals.flac") -Value "x"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\woodshed"
          $entry = Get-ItemProperty $key
          if ($entry.Publisher -ne "woodshed project" -or $entry.NoModify -ne 1 -or $entry.NoRepair -ne 1) { throw "the Settings entry is incomplete" }
          if ($entry.DisplayVersion -match "woodshed" -or -not $entry.DisplayVersion) { throw "DisplayVersion: $($entry.DisplayVersion)" }
          if ($entry.EstimatedSize -le 0) { throw "EstimatedSize: $($entry.EstimatedSize)" }
          $programs = [Environment]::GetFolderPath("Programs")
          $links = (Join-Path $programs "woodshed.lnk"), (Join-Path $programs "Uninstall woodshed.lnk")
          foreach ($l in $links) { if (-not (Test-Path $l)) { throw "no shortcut: $l" } }
          $script = $entry.UninstallString.Trim('"')
          if ((New-Object -ComObject WScript.Shell).CreateShortcut($links[1]).TargetPath -ne $script) { throw "the shortcut does not run the uninstall script" }
          $tools = Split-Path $script
          $bytes = Get-Item (uv cache dir).Trim() | Get-ChildItem -Recurse -File -Force | Measure-Object Length -Sum
          & $script --yes
          Write-Host "the uninstall script exited with $LASTEXITCODE"
          $gone = $false
          foreach ($i in 1..60) {
            if (-not ((uv tool list 2>$null) -match "^woodshed ")) { $gone = $true; break }
            Start-Sleep 1
          }
          $after = Get-Item (uv cache dir).Trim() | Get-ChildItem -Recurse -File -Force | Measure-Object Length -Sum
          Write-Host ("uv cache: {0:N0} KB before, {1:N0} KB after the uninstall (uv cache prune)" -f ($bytes.Sum / 1KB), ($after.Sum / 1KB))
          if (-not $gone) { throw "woodshed is still in uv tool list after 60 s" }
          if (Test-Path $exe) { throw "woodshed.exe is still there" }
          foreach ($l in $links) { if (Test-Path $l) { throw "the shortcut is still there: $l" } }
          if (Test-Path $key) { throw "the Settings > Apps entry is still there" }
          if ((Test-Path (Join-Path $cache "stems")) -or (Test-Path (Join-Path $cache "models"))) { throw "the cache tracks are still there" }
          if (Test-Path $script) { throw "the uninstall script is still there" }
          if (Test-Path $tools) { throw "the tools folder is still there" }
          if ((Get-Content (Join-Path $lib "kept.txt")) -ne "a song") { throw "the library was touched" }

  docker:
    name: Docker image, ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # x86, and ARM (sphn is compiled there)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t woodshed:test .
      - name: The library serves its home page
        run: |
          mkdir library
          sudo chown 1000:1000 library
          docker run -d --name woodshed -p 127.0.0.1:8000:8000 -v "$PWD/library:/library" woodshed:test
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' woodshed)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' woodshed)" = healthy
          curl -sf http://127.0.0.1:8000/ | grep -q "woodshed"
          docker run --rm --entrypoint woodshed woodshed:test --version
      - name: Another user id can write the library and the cache
        run: |
          mkdir other && sudo chown 4321:4321 other
          docker run --rm --user 4321:4321 -v "$PWD/other:/library" -v woodshed-other-cache:/cache \
            --entrypoint sh woodshed:test -c 'touch /library/ok /cache/ok'
      - if: failure()
        run: docker logs woodshed
