name: Install

# The ways a musician installs woodshed, tried on real machines: the install scripts on Linux,
# macOS and Windows (from this checkout), then a page built from the demo song; and the Docker image
# on x86 and ARM.

on:
  push:
    branches: [main]
    paths: ["scripts/install.*", "Dockerfile", "compose.yaml", ".dockerignore", "pyproject.toml", "uv.lock", ".github/workflows/install.yml"]
  pull_request:
    paths: ["scripts/install.*", "Dockerfile", "compose.yaml", ".dockerignore", "pyproject.toml", "uv.lock", ".github/workflows/install.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: Install script, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ffmpeg, as the script tells users to add it
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg; else sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; fi
      - name: Install woodshed with the script
        run: WOODSHED_SOURCE="$PWD" sh scripts/install.sh
      - name: A page from the demo song (the mix only, the models are not downloaded here)
        run: |
          "$(uv tool dir --bin)/woodshed" "demo/As I Am.mp3" --no-stems --no-open -o out
          test -f "out/As I Am.woodshed/index.html"

  windows:
    name: Install script, windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6  # v3.1
      - name: Install woodshed with the script
        shell: pwsh
        run: |
          $env:WOODSHED_SOURCE = (Get-Location).Path
          ./scripts/install.ps1
      - name: A page from the demo song, and the Start menu shortcut
        shell: pwsh
        run: |
          $exe = Join-Path (uv tool dir --bin).Trim() "woodshed.exe"
          & $exe "demo/As I Am.mp3" --no-stems --no-open -o out
          if ($LASTEXITCODE -ne 0) { throw "the page was not built" }
          if (-not (Test-Path "out/As I Am.woodshed/index.html")) { throw "no page" }
          $link = Join-Path ([Environment]::GetFolderPath("Programs")) "woodshed.lnk"
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }

  docker:
    name: Docker image, ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]  # x86, and ARM (sphn is compiled there)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t woodshed:test .
      - name: The library serves its home page
        run: |
          mkdir library
          sudo chown 1000:1000 library
          docker run -d --name woodshed -p 127.0.0.1:8000:8000 -v "$PWD/library:/library" woodshed:test
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' woodshed)" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' woodshed)" = healthy
          curl -sf http://127.0.0.1:8000/ | grep -q "woodshed"
          docker run --rm --entrypoint woodshed woodshed:test --version
      - name: Another user id can write the library and the cache
        run: |
          mkdir other && sudo chown 4321:4321 other
          docker run --rm --user 4321:4321 -v "$PWD/other:/library" -v woodshed-other-cache:/cache \
            --entrypoint sh woodshed:test -c 'touch /library/ok /cache/ok'
      - if: failure()
        run: docker logs woodshed
