name: Installers

# The double-click installers musicians download, attached to the GitHub release of each version tag:
# woodshed-installer-macos.zip (the .command file, zipped so that it stays executable) and
# woodshed-installer-windows.cmd, both set to install that tag. On pull requests and when run by
# hand, they are built and kept as a workflow artifact; run by hand with a tag, they are attached to
# that tag's release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["scripts/installers/**", "scripts/install.*", ".github/workflows/installers.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag whose release gets the installers (empty: the files are only kept as an artifact)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  installers:
    name: Build and attach
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release and upload its files
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Package
        run: |
          mkdir build dist
          cp "scripts/installers/Install woodshed.command" "scripts/installers/Install woodshed.cmd" build/
          if [ -n "$TAG" ]; then  # install the tag's version, not main's
            sed -i "s|WOODSHED_REF:-main}|WOODSHED_REF:-$TAG}|" "build/Install woodshed.command"
            sed -i "s|WOODSHED_REF=main\"|WOODSHED_REF=$TAG\"|" "build/Install woodshed.cmd"
            grep -qF "WOODSHED_REF:-$TAG}" "build/Install woodshed.command"
            grep -qF "WOODSHED_REF=$TAG\"" "build/Install woodshed.cmd"
          fi
          (cd build && zip -X ../dist/woodshed-installer-macos.zip "Install woodshed.command")
          cp "build/Install woodshed.cmd" dist/woodshed-installer-windows.cmd
          # Finder runs the file only if it is executable; cmd.exe wants Windows line endings.
          zipinfo dist/woodshed-installer-macos.zip | grep -q '^-rwxr-xr-x.*Install woodshed.command$'
          test "$(grep -c $'\r$' dist/woodshed-installer-windows.cmd)" = "$(wc -l < dist/woodshed-installer-windows.cmd)"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: woodshed-installers
          path: dist/*
          if-no-files-found: error
      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/woodshed-installer-macos.zip dist/woodshed-installer-windows.cmd --clobber
