name: Installers

# The double-click installers musicians download, attached to the GitHub release of each version tag:
# woodshed-installer-macos.zip (the .command file, zipped so that it stays executable) and
# woodshed-installer-windows.cmd, both set to install that tag (scripts/package-installers.sh). On
# pull requests and when run by hand, they are built and kept as a workflow artifact; run by hand
# with a tag, they are also attached to that tag's release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["scripts/installers/**", "scripts/install.*", "scripts/package-installers.sh", ".github/workflows/installers.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A version tag (v...): its installers are built and attached to its release. Empty: built from the chosen branch, kept as an artifact only."
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Package
        run: |
          scripts/package-installers.sh dist "$TAG"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: woodshed-installers
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: woodshed-installers
          path: dist
      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/woodshed-installer-macos.zip dist/woodshed-installer-windows.cmd --clobber
