[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 licence fields
build-backend = "hatchling.build"

[project]
name = "woodshed"
dynamic = ["version"]
description = "Turn any song file into a local practice room: chart, parts for every instrument, play-along."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Laurent Giovannoni" }]
keywords = ["music", "chords", "practice", "guitar", "bass", "drums", "chord-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Typing :: Typed",
]
dependencies = [
    "librosa>=0.11,<2",  # each version has its own golden labels (tests/golden)
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
stems = ["demucs>=4.1", "beat-this>=1.1", "torch>=2.1", "torchaudio>=2.1"]
bench = ["mir_eval>=0.8"]

[project.scripts]
woodshed = "woodshed.cli:main"

[project.urls]
Source = "https://github.com/laugiov/woodshed"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "twine>=5",
    "jsonschema>=4",
    "types-jsonschema",
    "pytest-playwright>=0.7",
    "pytest-xdist>=3.6",
]

[tool.hatch.version]
path = "src/woodshed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/woodshed"]

[tool.hatch.build.targets.sdist]
exclude = ["/private", "/.github", "/.venv*", "/docs"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venvs", "private"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Primes are the musical notation for section variants (A′, A″).
allowed-confusables = ["′", "″", "‴", "×"]  # × marks a repeat count in a chart

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "beat_this.*", "demucs.*", "torch.*", "torchaudio.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "stems: needs the stems extra (real Demucs and beat_this, downloads the models once)",
    "page: runs the practice page in real browsers (Playwright; browsers installed once)",
]
# Any warning is a test failure: a NaN or an empty slice usually shows up as a warning first.
filterwarnings = [
    "error",
    # Emitted by numba while it compiles a librosa kernel, only on the first run after its cache
    # is invalidated: the same inputs then run warning-free.
    "ignore:invalid value encountered in cast:RuntimeWarning:numba.np.ufunc.dufunc",
]

[tool.coverage.run]
source = ["woodshed"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.uv]
# Demucs pins an old PyTorch on Intel Macs that has no wheels for recent Pythons: the development
# lock file leaves Intel Macs out (CI runs on Apple silicon), and stops at the newest Python tested.
# End users are not affected by this.
environments = ["(sys_platform != 'darwin' or platform_machine != 'x86_64') and python_full_version < '3.15'"]

# Developers and CI get CPU-only PyTorch for the stems extra (the default Linux wheels pull ~5 GB of CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
