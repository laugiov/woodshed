<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" width="640" height="474" role="img" aria-labelledby="t d" font-family="Atkinson Hyperlegible, sans-serif">
<title id="t">Windows, step 1: Edge holds the download back; … then Keep (drawn)</title>
<desc id="d">A drawn Edge downloads list: woodshed-installer-windows.cmd isn't commonly downloaded. The … button (More actions, Plus d'actions) is outlined as 1a; in the menu it opens, Keep (Conserver) is outlined as 1b.</desc>
<rect width="640" height="474" rx="14" fill="#0d1210"/>
<rect x="1" y="1" width="638" height="472" rx="13" fill="#151b18" stroke="#6b7f77"/>
<text x="20" y="34" font-size="15" fill="#3cc4a9" font-weight="700">Windows, step 1 of 4</text>
<text x="620" y="34" font-size="13" fill="#94a19a" text-anchor="end">Windows 11 with Edge, drawn 2026-10</text>
<text x="20" y="70" font-size="13" fill="#94a19a">The downloads list, top right of Edge:</text>
<rect x="20" y="84" width="600" height="168" rx="12" fill="#19201d" stroke="#6b7f77" stroke-width="1.5"/>
<text x="42" y="118" font-size="18" fill="#e5ebe7" font-weight="700">woodshed-installer-windows.cmd</text>
<text x="42" y="150" font-size="14" fill="#94a19a">woodshed-installer-windows.cmd isn't commonly downloaded. Make sure you trust</text>
<text x="42" y="170" font-size="14" fill="#94a19a">woodshed-installer-windows.cmd before you open it.</text>
<rect x="553" y="196" width="45" height="34" rx="7" fill="#222b27" stroke="#6b7f77" stroke-width="1"/>
<text x="575.5" y="218" font-size="15" fill="#e5ebe7" font-weight="700" text-anchor="middle">…</text>
<rect x="548" y="191" width="55" height="44" rx="10" fill="none" stroke="#3cc4a9" stroke-width="3"/>
<circle cx="601" cy="193" r="13" fill="#3cc4a9"/>
<text x="601" y="198" font-size="14" fill="#0a1210" font-weight="700" text-anchor="middle">1a</text>
<text x="20" y="274" font-size="13" fill="#94a19a">The menu under …:</text>
<rect x="20" y="288" width="600" height="136" rx="12" fill="#19201d" stroke="#6b7f77" stroke-width="1.5"/>
<text x="56" y="319" font-size="15" fill="#e5ebe7">Delete</text>
<rect x="42" y="334" width="556" height="32" rx="6" fill="#222b27" stroke="#3cc4a9" stroke-width="3"/>
<circle cx="596" cy="336" r="13" fill="#3cc4a9"/>
<text x="596" y="341" font-size="14" fill="#0a1210" font-weight="700" text-anchor="middle">1b</text>
<text x="56" y="355" font-size="15" fill="#e5ebe7" font-weight="700">Keep</text>
<text x="56" y="391" font-size="15" fill="#e5ebe7">Report this file as safe</text>
<text x="20" y="454" font-size="15" fill="#e5ebe7" font-weight="700">Click … next to the file (1a), then Keep (Conserver) (1b)</text>
</svg>
